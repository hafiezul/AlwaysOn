name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and ad-hoc sign
        env:
          VERSION: 0.0.0-ci
        run: ./Scripts/build-app.sh

      - name: Test bundled native CLI
        run: python3 CLI/Tests/acceptance.py build/Build/Products/Release/AlwaysOn.app/Contents/Helpers/alwayson

      - name: Build installer DMG
        run: ./Scripts/build-dmg.sh build/Build/Products/Release/AlwaysOn.app artifacts/AlwaysOn-ci.dmg

      - name: Upload installer DMG
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysOn-installer-dmg
          path: artifacts/AlwaysOn-ci.dmg
          retention-days: 7

      - name: Run unit tests
        run: |
          xcodebuild \
            -project AlwaysOn.xcodeproj \
            -scheme AlwaysOn \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            test

  optimization-benchmark:
    name: Focused CPU comparison
    if: github.event_name == 'pull_request' && github.event.pull_request.base.sha == 'b53797a96f36f3ff22e960d6f3583b306f5b6a0c' && github.head_ref == 't3/optimize-application-quick-wins'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compare production sources
        run: python3 Scripts/benchmark-optimizations.py --baseline b53797a --candidate "${{ github.event.pull_request.head.sha }}"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results/
          if-no-files-found: error
