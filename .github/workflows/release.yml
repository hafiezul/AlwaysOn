name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build AlwaysOn
    runs-on: macos-latest
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      SPARKLE_VERSION: 2.8.1
      SPARKLE_ARCHIVE_SHA256: 5cddb7695674ef7704268f38eccaee80e3accbf19e61c1689efff5b6116d85be

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Xcode
        run: |
          # Use latest Xcode available on the runner
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Decide release mode
        run: |
          if [ -n "$SPARKLE_PRIVATE_KEY" ] && [ -n "$APPLE_CERTIFICATE_BASE64" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "RELEASE_MODE=signed" >> $GITHUB_ENV
            echo "UPDATE_MODE=sparkle" >> $GITHUB_ENV
            echo "Release mode: signed"
          else
            echo "RELEASE_MODE=unsigned" >> $GITHUB_ENV
            echo "UPDATE_MODE=manual" >> $GITHUB_ENV
            echo "Release mode: unsigned"
            echo "::warning::Apple signing/notarization secrets are missing. Publishing an unsigned manual-update release."
          fi

      - name: Set version from tag
        run: |
          # Extract version from tag (strip 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          
          # Generate build number from git commit count (always increases)
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          
          echo "Marketing Version: $VERSION"
          echo "Build Number: $BUILD_NUMBER"

      - name: Set up code signing
        if: env.RELEASE_MODE == 'signed'
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm certificate.p12
          
          # Set keychain for codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Find the signing identity
          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build app
        run: |
          if [ "$RELEASE_MODE" = "signed" ]; then
            xcodebuild -project AlwaysOn.xcodeproj \
              -scheme AlwaysOn \
              -configuration Release \
              -derivedDataPath build \
              -arch arm64 -arch x86_64 \
              ONLY_ACTIVE_ARCH=NO \
              ALWAYSON_UPDATE_MODE="$UPDATE_MODE" \
              CODE_SIGN_IDENTITY="Developer ID Application" \
              CODE_SIGNING_REQUIRED="YES" \
              CODE_SIGNING_ALLOWED="YES" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              build
          else
            xcodebuild -project AlwaysOn.xcodeproj \
              -scheme AlwaysOn \
              -configuration Release \
              -derivedDataPath build \
              -arch arm64 -arch x86_64 \
              ONLY_ACTIVE_ARCH=NO \
              ALWAYSON_UPDATE_MODE="$UPDATE_MODE" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED="NO" \
              CODE_SIGNING_ALLOWED="NO" \
              DEVELOPMENT_TEAM="" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              build
          fi

      - name: Download Sparkle
        if: env.RELEASE_MODE == 'signed'
        run: |
          # Download Sparkle release for signing tools
          curl -L -o Sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_ARCHIVE_SHA256}  Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p Sparkle
          tar -xf Sparkle.tar.xz -C Sparkle
          ls -la Sparkle/bin/

      - name: Prepare artifacts
        run: |
          # Create output directory
          mkdir -p artifacts

          # Get the app bundle path
          APP_PATH="build/Build/Products/Release/AlwaysOn.app"

          # Create ZIP
          cd build/Build/Products/Release
          zip -r -y "../../../../artifacts/AlwaysOn-${TAG_VERSION}.zip" AlwaysOn.app
          cd ../../../../

          # Create DMG
          # Create a temporary directory for DMG contents
          mkdir -p dmg-contents
          cp -R "$APP_PATH" dmg-contents/

          # Create a symlink to Applications folder
          ln -s /Applications dmg-contents/Applications

          # Create DMG
          hdiutil create -volname "AlwaysOn" \
            -srcfolder dmg-contents \
            -ov -format UDZO \
            "artifacts/AlwaysOn-${TAG_VERSION}.dmg"

          # Cleanup
          rm -rf dmg-contents

          # Create a helper script bound to this release version
          sed "s/__ALWAYSON_EXPECTED_VERSION__/${TAG_VERSION#v}/g" install-helper.sh > artifacts/install-helper.sh
          chmod +x artifacts/install-helper.sh

          # List artifacts
          ls -la artifacts/

      - name: Notarize app
        if: env.RELEASE_MODE == 'signed'
        run: |
          ZIP_PATH="artifacts/AlwaysOn-${TAG_VERSION}.zip"
          
          echo "Submitting app for notarization..."
          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          
          echo "Notarization complete!"
          
          # Staple the notarization ticket to the DMG
          DMG_PATH="artifacts/AlwaysOn-${TAG_VERSION}.dmg"
          if [ -f "$DMG_PATH" ]; then
            echo "Stapling notarization to DMG..."
            xcrun stapler staple "$DMG_PATH" || echo "Warning: Could not staple DMG"
          fi

      - name: Sign ZIP with Sparkle
        if: env.RELEASE_MODE == 'signed'
        run: |
          ZIP_PATH="artifacts/AlwaysOn-${TAG_VERSION}.zip"
          
          # Sign the ZIP and capture the signature
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_private_key
          SIGNATURE=$(./Sparkle/bin/sign_update "$ZIP_PATH" -f /tmp/sparkle_private_key)
          rm /tmp/sparkle_private_key
          
          # Extract just the signature value (format: sparkle:edSignature="..." length="...")
          ED_SIGNATURE=$(echo "$SIGNATURE" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)
          
          # Save signature for appcast update
          echo "$ED_SIGNATURE" > artifacts/signature.txt
          echo "Sparkle signature: $ED_SIGNATURE"

      - name: Update appcast.xml
        if: env.RELEASE_MODE == 'signed'
        run: |
          ZIP_PATH="artifacts/AlwaysOn-${TAG_VERSION}.zip"
          
          # Get file size
          FILE_SIZE=$(stat -f%z "$ZIP_PATH")
          
          # Get signature
          ED_SIGNATURE=$(cat artifacts/signature.txt)
          
          # Get current date in RFC 822 format
          PUB_DATE=$(date -R)
          
          # Download URL
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_VERSION}/AlwaysOn-${TAG_VERSION}.zip"
          
          # Create new appcast entry (will be uploaded as release asset)
          echo '<?xml version="1.0" encoding="utf-8"?>' > artifacts/appcast.xml
          echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">' >> artifacts/appcast.xml
          echo '  <channel>' >> artifacts/appcast.xml
          echo '    <title>AlwaysOn Updates</title>' >> artifacts/appcast.xml
          echo '    <description>Most recent changes with links to updates.</description>' >> artifacts/appcast.xml
          echo '    <language>en</language>' >> artifacts/appcast.xml
          echo '    <item>' >> artifacts/appcast.xml
          echo "      <title>Version ${VERSION}</title>" >> artifacts/appcast.xml
          echo "      <pubDate>${PUB_DATE}</pubDate>" >> artifacts/appcast.xml
          echo "      <sparkle:version>${BUILD_NUMBER}</sparkle:version>" >> artifacts/appcast.xml
          echo "      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" >> artifacts/appcast.xml
          echo '      <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>' >> artifacts/appcast.xml
          echo "      <enclosure url=\"${DOWNLOAD_URL}\" sparkle:edSignature=\"${ED_SIGNATURE}\" length=\"${FILE_SIZE}\" type=\"application/octet-stream\"/>" >> artifacts/appcast.xml
          echo '    </item>' >> artifacts/appcast.xml
          echo '  </channel>' >> artifacts/appcast.xml
           echo '</rss>' >> artifacts/appcast.xml
           
           echo "Generated appcast.xml:"
           cat artifacts/appcast.xml

      - name: Generate artifact checksums
        run: |
          cd artifacts
          FILES=(
            "AlwaysOn-${TAG_VERSION}.zip"
            "AlwaysOn-${TAG_VERSION}.dmg"
            install-helper.sh
          )

          if [ "$RELEASE_MODE" = "signed" ] && [ -f appcast.xml ]; then
            FILES+=(appcast.xml)
          fi

          shasum -a 256 "${FILES[@]}" > SHA256SUMS.txt

      - name: Create release notes
        run: |
          cat > release-notes.md << 'EOFNOTES'
          ## Installation
          
          1. Download the DMG below
          2. Drag to Applications folder
          3. Launch the app
          4. If Accessibility access is still blocked, download `install-helper.sh` and `SHA256SUMS.txt` from this same release
          5. Verify the helper, then run it locally:
          EOFNOTES
          if [ "$RELEASE_MODE" = "signed" ]; then
            cat >> release-notes.md << 'EOFNOTES'

          This release is signed and notarized. Sparkle in-app updates are enabled.
          EOFNOTES
          else
            cat >> release-notes.md << 'EOFNOTES'

          This release is unsigned. In-app Sparkle updates are disabled on purpose, and updates must be installed manually from GitHub Releases.
          EOFNOTES
          fi

          echo '   ```bash' >> release-notes.md
          echo '   grep '\'' install-helper.sh$'\'' SHA256SUMS.txt | shasum -a 256 -c' >> release-notes.md
          echo '   chmod +x install-helper.sh' >> release-notes.md
          echo '   ./install-helper.sh' >> release-notes.md
          echo '   ```' >> release-notes.md
          cat >> release-notes.md << 'EOFNOTES'
          6. Grant accessibility permission when prompted

          See the [README](https://github.com/hafiezul/AlwaysOn#installation) for full instructions.
          EOFNOTES

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TITLE="$TAG_VERSION"
          RELEASE_FLAGS=""

          if [ "$RELEASE_MODE" = "unsigned" ]; then
            RELEASE_TITLE="$TAG_VERSION (unsigned)"
          fi

          # Create release with assets and custom notes
          gh release create "$TAG_VERSION" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --generate-notes \
            artifacts/AlwaysOn-${TAG_VERSION}.zip \
            artifacts/AlwaysOn-${TAG_VERSION}.dmg \
            artifacts/install-helper.sh \
            artifacts/SHA256SUMS.txt

          if [ "$RELEASE_MODE" = "signed" ] && [ -f artifacts/appcast.xml ]; then
            gh release upload "$TAG_VERSION" artifacts/appcast.xml --clobber
          fi

      - name: Cleanup keychain
        if: always() && env.APPLE_CERTIFICATE_BASE64 != ''
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
