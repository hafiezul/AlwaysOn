name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, package, and publish
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          if [[ ! "$TAG_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag '$TAG_VERSION': release tags must look like v1.2.3" >&2
            exit 1
          fi
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Set version from tag
        run: |
          VERSION=${TAG_VERSION#v}
          BUILD_NUMBER=$(git rev-list --count HEAD)

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          echo "Marketing Version: $VERSION"
          echo "Build Number: $BUILD_NUMBER"

      - name: Build and ad-hoc sign
        run: ./Scripts/build-app.sh

      - name: Prepare DMG
        run: |
          APP_PATH="build/Build/Products/Release/AlwaysOn.app"
          DMG_PATH="artifacts/AlwaysOn-${TAG_VERSION}.dmg"

          mkdir -p artifacts
          mkdir -p dmg-contents
          cp -R "$APP_PATH" dmg-contents/
          ln -s /Applications dmg-contents/Applications

          hdiutil create -volname "AlwaysOn" \
            -srcfolder dmg-contents \
            -ov -format UDZO \
            "$DMG_PATH"

          rm -rf dmg-contents

          DMG_SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "DMG_SHA256=$DMG_SHA256" >> "$GITHUB_ENV"

          ls -la artifacts/

      - name: Create release notes
        run: |
          cat > release-notes.md << EOFNOTES
          ## Installation

          1. Download \`AlwaysOn-${TAG_VERSION}.dmg\` below.
          2. Open the DMG and drag \`AlwaysOn.app\` to Applications.
          3. Launch AlwaysOn from Applications.
          4. If macOS says Apple could not verify the app is free of malware, open System Settings > Privacy & Security, scroll to Security, click Open Anyway for AlwaysOn, then confirm Open Anyway.
          5. Grant Accessibility permission when prompted.

          This release is unsigned and uses manual updates from GitHub Releases.

          If Accessibility stops working after replacing the app, remove the old AlwaysOn entry from System Settings > Privacy & Security > Accessibility, then add and enable \`/Applications/AlwaysOn.app\` again.

          DMG SHA-256:

          \`\`\`
          ${DMG_SHA256}
          \`\`\`

          See the README for full installation and troubleshooting instructions.
          EOFNOTES

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_VERSION" \
            --title "$TAG_VERSION (unsigned)" \
            --notes-file release-notes.md \
            "artifacts/AlwaysOn-${TAG_VERSION}.dmg"
