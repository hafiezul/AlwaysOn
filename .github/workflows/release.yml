name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build AlwaysOn
    runs-on: macos-latest
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Xcode
        run: |
          # Use latest Xcode available on the runner
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app
        run: |
          # Build release configuration
          xcodebuild -project AlwaysOn.xcodeproj \
            -scheme AlwaysOn \
            -configuration Release \
            -derivedDataPath build \
            -arch arm64 -arch x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Download Sparkle
        run: |
          # Download Sparkle release for signing tools
          SPARKLE_VERSION="2.6.4"
          curl -L -o Sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p Sparkle
          tar -xf Sparkle.tar.xz -C Sparkle
          ls -la Sparkle/bin/

      - name: Prepare artifacts
        run: |
          # Create output directory
          mkdir -p artifacts

          # Get the app bundle path
          APP_PATH="build/Build/Products/Release/AlwaysOn.app"

          # Get version from tag (strip 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG_VERSION=${GITHUB_REF#refs/tags/}

          # Create ZIP
          cd build/Build/Products/Release
          zip -r -y "../../../../artifacts/AlwaysOn-${TAG_VERSION}.zip" AlwaysOn.app
          cd ../../../../

          # Create DMG
          # Create a temporary directory for DMG contents
          mkdir -p dmg-contents
          cp -R "$APP_PATH" dmg-contents/

          # Create a symlink to Applications folder
          ln -s /Applications dmg-contents/Applications

          # Create DMG
          hdiutil create -volname "AlwaysOn" \
            -srcfolder dmg-contents \
            -ov -format UDZO \
            "artifacts/AlwaysOn-${TAG_VERSION}.dmg"

          # Cleanup
          rm -rf dmg-contents

          # List artifacts
          ls -la artifacts/

      - name: Sign ZIP with Sparkle
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          ZIP_PATH="artifacts/AlwaysOn-${TAG_VERSION}.zip"
          
          # Sign the ZIP and capture the signature
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_private_key
          SIGNATURE=$(./Sparkle/bin/sign_update "$ZIP_PATH" -f /tmp/sparkle_private_key)
          rm /tmp/sparkle_private_key
          
          # Extract just the signature value (format: sparkle:edSignature="..." length="...")
          ED_SIGNATURE=$(echo "$SIGNATURE" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)
          
          # Save signature for appcast update
          echo "$ED_SIGNATURE" > artifacts/signature.txt
          echo "Sparkle signature: $ED_SIGNATURE"

      - name: Update appcast.xml
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          ZIP_PATH="artifacts/AlwaysOn-${TAG_VERSION}.zip"
          
          # Get file size
          FILE_SIZE=$(stat -f%z "$ZIP_PATH")
          
          # Get signature
          ED_SIGNATURE=$(cat artifacts/signature.txt)
          
          # Get current date in RFC 822 format
          PUB_DATE=$(date -R)
          
          # Download URL
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_VERSION}/AlwaysOn-${TAG_VERSION}.zip"
          
          # Get build number from Info.plist (CURRENT_PROJECT_VERSION)
          BUILD_NUMBER=$(grep -A1 'CFBundleVersion' AlwaysOn/Info.plist | grep -o '<string>[^<]*</string>' | sed 's/<[^>]*>//g')
          
          # Create new appcast entry
          echo '<?xml version="1.0" encoding="utf-8"?>' > appcast.xml
          echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">' >> appcast.xml
          echo '  <channel>' >> appcast.xml
          echo '    <title>AlwaysOn Updates</title>' >> appcast.xml
          echo '    <description>Most recent changes with links to updates.</description>' >> appcast.xml
          echo '    <language>en</language>' >> appcast.xml
          echo '    <item>' >> appcast.xml
          echo "      <title>Version ${VERSION}</title>" >> appcast.xml
          echo "      <pubDate>${PUB_DATE}</pubDate>" >> appcast.xml
          echo "      <sparkle:version>${BUILD_NUMBER}</sparkle:version>" >> appcast.xml
          echo "      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" >> appcast.xml
          echo '      <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>' >> appcast.xml
          echo "      <enclosure url=\"${DOWNLOAD_URL}\" sparkle:edSignature=\"${ED_SIGNATURE}\" length=\"${FILE_SIZE}\" type=\"application/octet-stream\"/>" >> appcast.xml
          echo '    </item>' >> appcast.xml
          echo '  </channel>' >> appcast.xml
          echo '</rss>' >> appcast.xml
          
          echo "Updated appcast.xml:"
          cat appcast.xml

      - name: Commit appcast.xml
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast.xml for ${GITHUB_REF#refs/tags/}" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}

          # Create release with assets
          gh release create "$TAG_VERSION" \
            --title "$TAG_VERSION" \
            --generate-notes \
            artifacts/AlwaysOn-${TAG_VERSION}.zip \
            artifacts/AlwaysOn-${TAG_VERSION}.dmg
