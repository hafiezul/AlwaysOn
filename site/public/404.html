<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · AlwaysOn</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3f2ec">
  <link rel="icon" type="image/png" href="/images/icon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Mona+Sans:ital,wdth,wght@0,75..125,300..900;1,75..125,300..900&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/" aria-label="AlwaysOn home">
      <span class="wordmark-a">Always</span>
      <span class="wordmark-b">ON</span>
    </a>
  </header>
  <main class="not-found">
    <div class="eyebrow"><span class="dot" style="--c: var(--away)"></span><span>404</span></div>
    <h1 class="display"><span class="serif accent-ink">this page is</span><br><span class="wide">Away</span></h1>
    <p class="section-lede">There's nothing at this address.</p>
    <a class="pill pill--signal" href="/">Go to the home page</a>
  </main>
</body>
</html>
